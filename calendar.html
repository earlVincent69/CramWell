<!DOCTYPE html>
<html lang="en">
<head>
	<title>CramWell | Calendar</title>
	<link rel="stylesheet" href="../css/style.css">
	<style>
		.calendar-container {
			background: #fff;
			padding: 20px;
			border-radius: 10px;
			box-shadow: 0 2px 6px rgba(0,0,0,0.1);
			text-align: center;
			margin-left: -200px;
		}
		.month-nav {
			display: flex;
			justify-content: center;
			align-items: center;
			gap: 10px;
			margin-bottom: 10px;
		}
		.month-nav button {
			background: #53ae81;
			color: #fff;
			border: none;
			border-radius: 5px;
			padding: 4px 8px;
			cursor: pointer;
		}
		#calendar {
			display: grid;
			grid-template-columns: repeat(7, 1fr);
			gap: 5px;
			width: 700px;
			margin: 0 auto;
		}
		.day {
			background: #fff;
			border: 1px solid #ccc;
			border-radius: 8px;
			padding: 5px;
			height: 45px;
			text-align: center;
			font-size: 13px;
		}
		.day:hover {
			background: #e8f5e9;
		}
		.current-day {
			background: #b7f5b7;
			font-weight: bold;
		}
	</style>
</head>
<body>
	<header>
		<div class="logo">
			<img src="../image/cramWell.png" alt="CramWell Logo" style="width: 215px; height: auto;">
		</div>
		<nav>
			<a href="index.html">Home</a>
			<a href="tasks.html">Tasks</a>
			<a href="calendar.html" class="active">Calendar</a>
			<a href="about.html">About</a>
			<a href="login.html" class="login-btn">Log In</a>
		</nav>
	</header>

	<section class="main">
		<div class="text">
			<h1>Creating Responsible and Active Minds With Effective Learning and Lifestyle</h1>
			<h2>Study Calendar</h2>
			<p>Plan and track your activities with CramWell’s simple calendar view.</p>
			<a href="signup.html" class="btn">Get Started</a>
		</div>

		<div class="calendar-container">
			<div class="month-nav">
				<button id="prevMonth">&#9664;</button>
				<h3 id="monthYear"></h3>
				<button id="nextMonth">&#9654;</button>
			</div>
			<div id="calendar"></div>
		</div>
	</section>

	<script>
		const calendar = document.getElementById('calendar');
		const monthYear = document.getElementById('monthYear');
		let currentDate = new Date();

		function renderCalendar(year, month) {
			calendar.innerHTML = '';
			const firstDay = new Date(year, month, 1).getDay();
			const daysInMonth = new Date(year, month + 1, 0).getDate();
			const today = new Date();
			const isCurrent = today.getMonth() === month && today.getFullYear() === year;
			monthYear.textContent = new Date(year, month).toLocaleString('default', { month: 'long', year: 'numeric' });
			for (let i = 0; i < firstDay; i++) calendar.appendChild(document.createElement('div'));
			for (let i = 1; i <= daysInMonth; i++) {
				const day = document.createElement('div');
				day.className = 'day';
				day.textContent = i;
				if (isCurrent && i === today.getDate()) day.classList.add('current-day');
				calendar.appendChild(day);
			}
		}

		document.getElementById('prevMonth').onclick = () => {
			currentDate.setMonth(currentDate.getMonth() - 1);
			renderCalendar(currentDate.getFullYear(), currentDate.getMonth());
		};
		document.getElementById('nextMonth').onclick = () => {
			currentDate.setMonth(currentDate.getMonth() + 1);
			renderCalendar(currentDate.getFullYear(), currentDate.getMonth());
		};
		renderCalendar(currentDate.getFullYear(), currentDate.getMonth());
	</script>
</body>
</html>
